name: lanes-gate
on:
  # pull_request_target, not pull_request: the job below always checks out and runs the default branch's own copy of
  # gate.mjs and lanes.config.json, never the PR's, and it never runs any PR code. A PR must not be able to grant
  # itself elevated context by editing this workflow (I3); pull_request_target keeps default-branch secrets while a
  # PR's own workflow changes still cannot run here (they can only run once merged into the queue; see docs/USING.md).
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  status:
  # #36: a closed issue may unblock PRs whose task issue lists it in "Blocked by"; gate.mjs re-evaluates those.
  # Same rules as every other trigger: default-branch code only, no PR code, and no permission beyond the above.
  issues:
    types: [closed]
  merge_group:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-evaluate (for example after an issue's tier label changed)
        required: true
# issues: write and pull-requests: write are only for #82 (ADR 0004): gate.mjs comments on a PR when an owner approval
# lands on its head, and GitHub requires pull-request write access to comment on a pull request (#342).
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
concurrency:
  group: lanes-gate-${{ github.event.pull_request.head.sha || github.event.sha || github.event.merge_group.head_sha || github.event.inputs.pr || format('issue-{0}', github.event.issue.number) }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name != 'status' || github.event.context != 'lanes/gate'
    runs-on: ubuntu-latest
    steps:
      # The default branch's gate and config, never the PR's: a PR must not be able to rewrite its own gate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node scripts/lanes/gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          STATUS_SHA: ${{ github.event.sha }}
          STATUS_CONTEXT: ${{ github.event.context }}
          STATUS_STATE: ${{ github.event.state }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
